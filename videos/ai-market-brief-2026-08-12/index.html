<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" crossorigin="anonymous"></script>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0B}#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0B0B0B}.scene{position:absolute;inset:0;width:1080px;height:1920px}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <div id="host-conflict" class="scene" data-composition-id="conflict" data-composition-src="compositions/frames/01-conflict.html" data-start="0" data-duration="7.104" data-track-index="0"></div>
      <div id="host-divergence" class="scene" data-composition-id="divergence" data-composition-src="compositions/frames/02-divergence.html" data-start="7.104" data-duration="7.296" data-track-index="0"></div>
      <div id="host-cpi" class="scene" data-composition-id="cpi-pipeline" data-composition-src="compositions/frames/03-cpi-pipeline.html" data-start="14.4" data-duration="6.216" data-track-index="0"></div>
      <div id="host-earnings" class="scene" data-composition-id="earnings-console" data-composition-src="compositions/frames/04-earnings-console.html" data-start="20.616" data-duration="19.896" data-track-index="0"></div>
      <div id="host-trade" class="scene" data-composition-id="trade-map" data-composition-src="compositions/frames/05-trade-map.html" data-start="40.512" data-duration="9.312" data-track-index="0"></div>
      <div id="host-risk" class="scene" data-composition-id="risk-lines" data-composition-src="compositions/frames/06-risk-lines.html" data-start="49.824" data-duration="10.176" data-track-index="0"></div>
      <audio id="daily-voiceover" class="clip" src="assets/audio/voiceover.wav" data-start="0" data-duration="60" data-track-index="8" data-volume="1" preload="auto"></audio>
      <div id="host-captions" class="scene" data-layout-allow-overlap data-composition-id="daily-captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="60" data-track-index="9"></div>
    </div>
    <script>
      window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.to({},{duration:60},0);window.__timelines.main=tl;
    </script>
  </body>
</html>
