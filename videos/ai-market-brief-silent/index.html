<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F0ECE5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="7.6"
        data-track-index="0"
      ></div>

      <div
        id="el-02-drivers"
        class="scene"
        data-composition-id="02-drivers"
        data-composition-src="compositions/frames/02-drivers.html"
        data-start="7"
        data-duration="9.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-cpi-chain"
        class="scene"
        data-composition-id="03-cpi-chain"
        data-composition-src="compositions/frames/03-cpi-chain.html"
        data-start="16"
        data-duration="11.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-ai-chain"
        class="scene"
        data-composition-id="04-ai-chain"
        data-composition-src="compositions/frames/04-ai-chain.html"
        data-start="27"
        data-duration="13.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-stocks"
        class="scene"
        data-composition-id="05-stocks"
        data-composition-src="compositions/frames/05-stocks.html"
        data-start="40"
        data-duration="11.6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-close"
        class="scene"
        data-composition-id="06-close"
        data-composition-src="compositions/frames/06-close.html"
        data-start="51"
        data-duration="9"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-02-drivers", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 7);
        tl.to("#el-02-drivers", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16);
        tl.fromTo("#el-03-cpi-chain", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16);
        tl.to("#el-03-cpi-chain", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 27);
        tl.fromTo("#el-04-ai-chain", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 27);
        tl.to("#el-04-ai-chain", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 40);
        tl.fromTo("#el-05-stocks", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 40);
        tl.to("#el-05-stocks", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 51);
        tl.fromTo("#el-06-close", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 51);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
